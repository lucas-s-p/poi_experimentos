# Demanda do experimento. target_rps e a intensidade são definidos pela calibração (calibrate.sh).
query: size_mb=128&passes=4&hold_ms=400   # intensidade fixa: 128 MB retidos por ~400 ms, 4 passes aleatórios
target_rps: null             # carga-alvo (nível 100%)
levels_pct: [25, 50, 75, 100, 125]
warmup_s: 40
duration_s: 60               # duração de cada repetição
reps: 3
pause_s: 10                  # pausa entre repetições (inclui a checagem de host ocioso, 10 s)
max_vus: 500
quick:                       # ./run_experiment.sh --quick <cenario>
  levels_pct: [50, 125]
  duration_s: 20
  warmup_s: 40
  reps: 1
