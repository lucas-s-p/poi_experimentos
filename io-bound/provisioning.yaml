# Cenários de provisionamento da io-bound: varia só o limite de banda do disco (VBoxManage bandwidthctl),
# com vCPU e RAM fixos e RAM baixa (1 GB) para o page cache ajudar menos. Limites (MiB/s) definidos pela calibração.
app: io-bound
service: poi-io
port: 8003
fixed:
  vcpus: 2
  ram_mb: 1024
scenarios:
  - {id: s1-sub,         name: Sub,                 disk_bw: 29M}
  - {id: s2-sub-adeq,    name: Sub→Adequada,        disk_bw: 49M}
  - {id: s3-adequada,    name: Adequada,            disk_bw: 69M}
  - {id: s4-adeq-super,  name: Adequada→Super,      disk_bw: 140M}
  - {id: s5-super,       name: Super,               disk_bw: 210M}
