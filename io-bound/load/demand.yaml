# Demanda do experimento. target_rps e a intensidade são definidos pela calibração (calibrate.sh).
query: size_kb=1024          # intensidade fixa de cada requisição (provisória; ver calibração)
target_rps: null             # carga-alvo (nível 100%)
levels_pct: [25, 50, 75, 100, 125]
reset_between_reps: true     # antes de cada rodada: reinicia o serviço, swapoff/swapon, drop_caches, apaga arquivos da app
reset_extra: rm -rf /var/tmp/poi-io   # arquivos deixados por requisições interrompidas
warmup_s: 40                 # por rodada (logo antes da medição, após o reset)
duration_s: 60
reps: 3
pause_s: 10
max_vus: 500
quick:
  levels_pct: [50, 125]
  duration_s: 20
  warmup_s: 40
  reps: 1
